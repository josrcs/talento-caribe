<!DOCTYPE html>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'">

  <script vite-ignore src="js/i18n-en.js"></script>
  <script vite-ignore src="js/i18n-en-cursos.js"></script>
  <script vite-ignore src="js/i18n.js"></script>

  <meta property="og:site_name" content="Talento Caribe">

  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Talento Caribe sobre un amanecer en el mar">
