<!DOCTYPE html>
<html lang="es" data-react>
<head>
  <meta charset="UTF-8">
  <!-- Seguridad: el navegador solo ejecuta scripts de este sitio (en GitHub Pages no hay cabeceras propias; el servidor envía la suya). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages muestra esta página para cualquier dirección que no exista, también dentro de carpetas
       (/talento-caribe/admin/algo). La base hace que estilos, imágenes y enlaces funcionen desde cualquier nivel.
       Si el repositorio cambia de nombre, cambia /talento-caribe/ aquí. El servidor de Node la reemplaza por "/". -->
  <base href="/talento-caribe/">
  <!-- Tema e idioma: se aplican antes de pintar (sin parpadeo) -->
  <script vite-ignore src="js/i18n-en.js"></script>
  <script vite-ignore src="js/i18n.js"></script>
  <title>Página no encontrada | Talento Caribe</title>
  <meta name="description" content="La página que buscas no existe o cambió de dirección.">
  <link rel="icon" vite-ignore href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap">
  <link rel="stylesheet" vite-ignore href="css/tema.css">
  <link rel="stylesheet" vite-ignore href="css/style.css">
  <link rel="stylesheet" vite-ignore href="css/admin.css">
  <link rel="stylesheet" vite-ignore href="css/efectos.css">
  <link rel="stylesheet" vite-ignore href="css/plataforma.css">
</head>
<body class="page-login">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <!-- La página la arma React (src/paginas/no-encontrada/). Si JavaScript está apagado, se ve este aviso. -->
  <div id="raiz"><noscript><p class="noscript">Activa JavaScript para usar Talento Caribe.</p></noscript></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Scripts compartidos con el portal y el panel (el puente de React está en src/lib/plataforma.js) -->
  <script vite-ignore src="js/efectos.js" defer></script>
  <script type="module" src="/src/paginas/no-encontrada.jsx"></script>
</body>
</html>
